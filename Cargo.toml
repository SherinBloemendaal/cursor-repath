[package]
name = "crepath"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "CLI helper for Cursor IDE operations not exposed in the UI"
license = "MIT"
repository = "https://github.com/SherinBloemendaal/cursor-repath"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.8"
dirs = "6"
fs_extra = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
url = "2"
percent-encoding = "2"
owo-colors = "4"
chrono = "0.4"
comfy-table = "7"
flate2 = "1"
tar = "0.4"
walkdir = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
indicatif = "0.18"
dialoguer = "0.12"
regex = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
